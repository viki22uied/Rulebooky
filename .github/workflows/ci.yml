name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run from the Actions tab, no empty "ci retry" commits needed

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Python 3.9 is end-of-life and is no longer built for ubuntu-latest
        # (Ubuntu 26.04), which is what broke CI. 3.9 is still checked on macOS
        # because /usr/bin/python3 there is 3.9.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run end-to-end hook tests
        run: python tests/run_tests.py

      - name: Run stress tests
        run: python tests/stress_test.py

      - name: Compile-check all sources
        run: python -m compileall -q scripts tests

  gate:
    # Single required check for branch protection. `if: always()` makes it fail
    # (not skip) when a test job fails; a skipped check counts as passing.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Test jobs result: ${{ needs.tests.result }}"
            exit 1
          fi
          echo "All test jobs passed."
